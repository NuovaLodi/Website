<!DOCTYPE html>
<html lang="it" class="scroll-smooth">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.S.D. Nuova Lodi 1952 - News ed Eventi</title><base href="../">
    <script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/custom.css">
    <script>tailwind.config = { theme: { extend: { colors: { brandRed: '#D32F2F', brandYellow: '#FFD54F', brandDark: '#1E293B' }, fontFamily: { sans: ['Montserrat', 'sans-serif'] } } } };</script><script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body data-site-architecture="multipage" data-page="news" class="bg-gray-50 text-gray-800 font-sans flex flex-col min-h-screen">
    <main id="page-news" class="hidden">
        <!-- Banner Introduttivo -->
        <section class="bg-brandDark text-white py-12 px-4 border-b-4 border-brandRed">
            <div class="max-w-7xl mx-auto text-center space-y-2">
                <span class="text-brandYellow font-extrabold text-xs uppercase tracking-widest">A.S.D. Nuova Lodi 1952</span>
                <h1 class="text-3xl md:text-5xl font-black uppercase tracking-tight">News & Eventi</h1>
                <p class="text-gray-300 font-medium text-sm md:text-base max-w-2xl mx-auto">
                    Tutti gli aggiornamenti, i comunicati ufficiali, le cronache delle gare ed i prossimi appuntamenti della società.
                </p>
            </div>
        </section>

        <div class="max-w-7xl mx-auto px-4 py-12 space-y-8">
            <!-- Filtro/Info Cronologica -->
            <div class="flex justify-between items-center border-b pb-4">
                <span class="text-xs font-bold text-gray-500 uppercase tracking-wider">
                    <i class="fa-solid fa-arrow-down-wide-short text-brandRed mr-1"></i> Ordine cronologico: Dal più recente al più datato
                </span>
                <span class="text-xs bg-gray-100 text-gray-600 px-3 py-1 rounded-full font-semibold" id="news-count-badge">
                    Totale notizie: 0
                </span>
            </div>

            <!-- Contenitore News -->
            <div id="news-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              <!-- Le news verranno inserite qui dallo script -->
              <p class="text-gray-500">Caricamento notizie in corso...</p>
            </div>
            
        </div>
    </main>
    <script defer src="js/page-layout.js"></script><script src="js/content-data.js"></script><script defer src="js/app.bundle.js"></script>
</body>
</html>
