<!DOCTYPE html>
<html lang="it" class="scroll-smooth">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.S.D. Nuova Lodi 1952 - Sponsor</title><base href="../">
    <script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/custom.css">
    <script>tailwind.config = { theme: { extend: { colors: { brandRed: '#D32F2F', brandYellow: '#FFD54F', brandDark: '#1E293B' }, fontFamily: { sans: ['Montserrat', 'sans-serif'] } } } };</script><script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body data-site-architecture="multipage" data-page="sponsor" class="bg-gray-50 text-gray-800 font-sans flex flex-col min-h-screen">
    <main id="page-sponsor" class="hidden">
        <!-- Banner Introduttivo -->
        <section class="bg-brandDark text-white py-12 px-4 border-b-4 border-brandRed">
            <div class="max-w-7xl mx-auto text-center space-y-2">
                <span class="text-brandYellow font-extrabold text-xs uppercase tracking-widest">A.S.D. Nuova Lodi 1952</span>
                <h1 class="text-3xl md:text-5xl font-black uppercase tracking-tight">I Nostri Partner</h1>
                <p class="text-gray-300 font-medium text-sm md:text-base max-w-2xl mx-auto">
                    Ringraziamo le aziende e le realtà locali che sostengono la nostra attività sportiva ed educativa ogni giorno.
                </p>
            </div>
        </section>

        <div class="max-w-7xl mx-auto px-4 py-12 space-y-12">

            <!-- SEZIONE 1: MAIN SPONSORS -->
            <section class="space-y-6">
                <div class="border-b-2 border-brandRed pb-3 flex items-center justify-between">
                    <div>
                        <span class="text-xs font-bold text-brandRed uppercase tracking-widest">Partner Ufficiali</span>
                        <h2 class="text-2xl font-extrabold uppercase text-brandDark tracking-tight">Main Sponsor</h2>
                    </div>
                    <i class="fa-solid fa-star text-brandYellow text-xl"></i>
                </div>

                <!-- Griglia Main Sponsor -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="page-main-sponsors-container">
                    <!-- Popolato da JavaScript -->
                </div>
            </section>

            <!-- SEZIONE 2: SOSTENITORI -->
            <section class="space-y-6">
                <div class="border-b-2 border-gray-300 pb-3 flex items-center justify-between">
                    <div>
                        <span class="text-xs font-bold text-gray-500 uppercase tracking-widest">Sostegno Locale</span>
                        <h2 class="text-2xl font-extrabold uppercase text-brandDark tracking-tight">Sostenitori & Amici del Club</h2>
                    </div>
                    <i class="fa-solid fa-handshake text-gray-400 text-xl"></i>
                </div>

                <!-- Griglia Sostenitori -->
                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4" id="page-sostenitori-container">
                    <!-- Popolato da JavaScript -->
                </div>
            </section>

        </div>
    </main>
    <script defer src="js/page-layout.js"></script><script src="js/content-data.js"></script><script defer src="js/app.bundle.js"></script>
</body>
</html>
