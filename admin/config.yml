backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

locale: "it"

collections:
  # -------------------------------------------------------------
  # 1. GESTIONE CALENDARIO E RISULTATI
  # -------------------------------------------------------------
  - name: "partite"
    label: "Calendario & Risultati"
    folder: "content/partite"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Categoria", name: "categoria", widget: "select", options: ["Prima Squadra", "Terza Categoria U21", "Juniores U19", "Allievi U17", "Giovanissimi U15", "Esordienti U13", "Pulcini U11"] }
      - { label: "Squadra Casa", name: "squadraCasa", widget: "string" }
      - { label: "Squadra Ospite", name: "squadraOspite", widget: "string" }
      - { label: "Data e Ora", name: "dataOra", widget: "datetime" }
      - { label: "Luogo / Campo", name: "luogo", widget: "select", options: ["C.S. Selvagreca (Lodi)", "Oratorio Cabrini (Lodi)", "Trasferta"] }
      - { label: "Indirizzo Trasferta", name: "indirizzoTrasferta", widget: "string", required: false, hint: "Esempio: Via Roma 15, Sant'Angelo Lodigiano" }
      - { label: "Stato Partita", name: "stato", widget: "select", options: ["Programmata", "Conclusa", "Rinviata"], default: "Programmata" }
      - { label: "Gol Squadra Casa", name: "golCasa", widget: "number", value_type: "int", required: false }
      - { label: "Gol Squadra Ospite", name: "golOspite", widget: "number", value_type: "int", required: false }
      - { label: "Marcatori / Note", name: "note", widget: "text", required: false }

  # -------------------------------------------------------------
  # 2. GESTIONE NEWS & EVENTI
  # -------------------------------------------------------------
  - name: "news"
    label: "News & Eventi"
    folder: "content/news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Titolo Notizia", name: "titolo", widget: "string" }
      - { label: "Data Pubblicazione", name: "data", widget: "datetime" }
      - { label: "Categoria", name: "categoria", widget: "select", options: ["Iscrizioni", "Tornei", "Società", "Eventi", "Impianti"] }
      - { label: "Estratto Breve", name: "estratto", widget: "text" }
      - { label: "Testo Articolo", name: "body", widget: "markdown" }
      - { label: "Immagine", name: "immagine", widget: "image", required: false }

  # -------------------------------------------------------------
  # 3. GESTIONE SPONSOR
  # -------------------------------------------------------------
  - name: "sponsor"
    label: "Sponsor & Partner"
    folder: "content/sponsor"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Nome Azienda", name: "nome", widget: "string" }
      - { label: "Tipologia", name: "tipo", widget: "select", options: ["main", "sostenitore"] }
      - { label: "Descrizione", name: "descrizione", widget: "text", required: false }
      - { label: "Link Sito Web", name: "sito", widget: "string", required: false }
      - { label: "Logo", name: "logo", widget: "image", required: false }

  # -------------------------------------------------------------
  # 3. ROSE
  # -------------------------------------------------------------
  - name: "rose"
    label: "Rose Squadre"
    folder: "content/rose"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Categoria", name: "categoria", widget: "select", options: ["Prima Squadra", "Terza Categoria U21", "Juniores U19", "Allievi U17", "Giovanissimi U15", "Esordienti U13", "Pulcini U11"] }
      - { label: "Ruolo", name: "ruolo", widget: "select", options: ["Portiere", "Difensore", "Centracampista", "Attaccante", "Allenatore", "Vice Allenatore", "Dirigente"] }
      - { label: "Nome", name: "nome", widget: "text", required: true }
      - { label: "Numero maglio", name: "numero", widget: "string", required: false }
      - { label: "Foto", name: "foto", widget: "image", required: false }
